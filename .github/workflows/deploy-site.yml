name: Deploy public site

# The Aquorbium page on GitHub Pages (https://lucioaraujo.github.io/aquorbium/).
# Copied from the Trioio workflow (lucioaraujo/trioio, commit 383c009,
# .github/workflows/deploy-site.yml, same author and licence; the Trioio's
# came from the Antitotem, 6c88ab4) on 2026-10-26, unchanged but for this
# header. Public repository: GitHub Pages and Actions cost nothing.
# Runs only when the site changes; the pages are generated locally
# (website/gerar_paginas.py && website/seo.py) and committed.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
